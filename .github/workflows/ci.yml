name: Revalta CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
      - release-preview
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: revalta-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, test, migrate and build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16-alpine@sha256:57c72fd2a128e416c7fcc499958864df5301e940bca0a56f58fddf30ffc07777
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: revalta_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d revalta_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/revalta_ci
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/revalta_ci
      JWT_SECRET: ci-secret-only-for-build-at-least-32-bytes
      EMAIL_FROM: noreply@revalta.se
      NODE_ENV: test

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate release configuration
        run: npm run validate:release-config

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Validate Prisma schema
        run: npx prisma validate

      - name: Apply migrations to clean database
        run: npx prisma migrate deploy

      - name: Check migration status
        run: npx prisma migrate status

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test:ci

      - name: Type check
        run: npm run typecheck

      - name: Audit production dependencies
        run: npm run audit:prod

      - name: Build without production migrations
        env:
          NODE_ENV: production
        run: npm run build:ci
