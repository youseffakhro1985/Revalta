name: Preview Health Attestation

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  deployments: read

jobs:
  attest:
    if: github.head_ref == 'fix/revalta-preview-gate-2026-09-07'
    runs-on: ubuntu-latest
    steps:
      - name: Resolve exact-SHA Preview
        id: preview
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 30); do
            deployments=$(curl --fail --silent --show-error \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/deployments?sha=${HEAD_SHA}")
            statuses_url=$(printf '%s' "$deployments" | jq -r --arg sha "$HEAD_SHA" '[.[] | select(.environment == "Preview" and .sha == $sha)][0].statuses_url // empty')
            if [[ -n "$statuses_url" ]]; then
              statuses=$(curl --fail --silent --show-error \
                -H "Authorization: Bearer ${GH_TOKEN}" \
                -H "Accept: application/vnd.github+json" \
                -H "X-GitHub-Api-Version: 2022-11-28" \
                "$statuses_url")
              state=$(printf '%s' "$statuses" | jq -r '.[0].state // empty')
              url=$(printf '%s' "$statuses" | jq -r '.[0].environment_url // .[0].target_url // empty')
              if [[ "$state" == "success" && "$url" =~ ^https://[a-z0-9-]+\.vercel\.app/?$ ]]; then
                echo "url=${url%/}" >> "$GITHUB_OUTPUT"
                exit 0
              fi
              if [[ "$state" == "failure" || "$state" == "error" ]]; then
                echo "Exact-SHA Preview deployment failed" >&2
                exit 1
              fi
            fi
            sleep 10
          done
          echo "Exact-SHA Preview not available" >&2
          exit 1

      - name: Attest public health identity
        env:
          PREVIEW_URL: ${{ steps.preview.outputs.url }}
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
          EXPECTED_DATA_PLANE_ID: 2eb0d0064180411ff1a387ae263f65bffb286f72a903c79cc7eb23a729a8abdd
        shell: bash
        run: |
          set -euo pipefail
          body=$(mktemp)
          status=$(curl --silent --show-error --location --max-redirs 0 --connect-timeout 10 --max-time 20 \
            -o "$body" -w '%{http_code}' "${PREVIEW_URL}/api/health" || true)
          echo "HTTP status: ${status}"
          if [[ "$status" != "200" ]]; then
            echo "Preview health is not publicly reachable with HTTP 200" >&2
            exit 1
          fi

          health_status=$(jq -r '.status // "missing"' "$body")
          database=$(jq -r '.database // "missing"' "$body")
          commit_sha=$(jq -r '.release.commitSha // "missing"' "$body")
          environment=$(jq -r '.release.environment // "missing"' "$body")
          deployment_id_present=$(jq -r '(.release.deploymentId != null)' "$body")
          data_plane=$(jq -r '.dataPlane.identity // "missing"' "$body")
          direct_matches=$(jq -r '.dataPlane.directMatches // false' "$body")

          echo "health.status=${health_status}"
          echo "health.database=${database}"
          echo "release.commitSha=${commit_sha}"
          echo "release.environment=${environment}"
          echo "release.deploymentId.present=${deployment_id_present}"
          echo "dataPlane.identity=${data_plane}"
          echo "dataPlane.directMatches=${direct_matches}"

          [[ "$health_status" == "ok" ]]
          [[ "$database" == "ok" ]]
          [[ "$commit_sha" == "$EXPECTED_SHA" ]]
          [[ "$environment" == "preview" ]]
          [[ "$deployment_id_present" == "true" ]]
          [[ "$data_plane" == "$EXPECTED_DATA_PLANE_ID" ]]
          [[ "$direct_matches" == "true" ]]
