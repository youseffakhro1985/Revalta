name: Revalta CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  quality:
    name: Lint and build
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/revalta_ci
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/revalta_ci
      JWT_SECRET: ci-secret-only-for-build
      EMAIL_FROM: noreply@revalta.se
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build without production migrations
        run: npm run build:ci
