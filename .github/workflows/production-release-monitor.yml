name: Production Release Monitor

on:
  workflow_dispatch:
  schedule:
    - cron: "17,47 * * * *"

permissions:
  contents: read

concurrency:
  group: production-release-monitor
  cancel-in-progress: true

jobs:
  verify-production-release:
    name: Verify production release identity
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Probe production health and release identity
        shell: bash
        env:
          HEALTH_URL: https://www.revalta.se/api/health
          GITHUB_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail

          headers_file="$(mktemp)"
          body_file="$(mktemp)"
          main_file="$(mktemp)"
          trap 'rm -f "$headers_file" "$body_file" "$main_file"' EXIT

          http_status="$(curl \
            --silent \
            --show-error \
            --location \
            --retry 3 \
            --retry-all-errors \
            --retry-delay 2 \
            --connect-timeout 10 \
            --max-time 30 \
            --dump-header "$headers_file" \
            --output "$body_file" \
            --write-out '%{http_code}' \
            "$HEALTH_URL")"

          if [[ "$http_status" != "200" ]]; then
            echo "Production health returned HTTP $http_status"
            cat "$body_file"
            exit 1
          fi

          jq -e '.ok == true and .status == "ok" and .database == "ok" and .schemaReady == true' "$body_file" >/dev/null
          jq -e '.release.environment == "production"' "$body_file" >/dev/null
          jq -e '.release.commitSha | test("^[0-9a-f]{40}$")' "$body_file" >/dev/null
          jq -e '.release.shortCommitSha | test("^[0-9a-f]{7}$")' "$body_file" >/dev/null
          jq -e '.release.branch == "main"' "$body_file" >/dev/null
          jq -e '.dataPlane.directMatches == true' "$body_file" >/dev/null
          jq -e '.dataPlane.identity | test("^[a-f0-9]{64}$")' "$body_file" >/dev/null
          jq -e '.components.database == "ok" and .components.schema == "ok" and .components.dataPlane == "ok"' "$body_file" >/dev/null

          production_identity="$(jq -r '.dataPlane.identity' "$body_file")"
          if [[ "$production_identity" == "6237f01010de725a8e35dcdb90b4f1b933bb009aa2d822155d6efe18f61ede3f" ]]; then
            echo "::error title=PRODUCTION_SHARES_PREVIEW_DATAPLANE::Production health is attached to the Preview data plane"
            exit 1
          fi
          if [[ "$production_identity" != "e51d9599fa4b3c03898d33a44d3fb5973987e8fd3569896aa3c005fc5673ba2a" ]]; then
            echo "::error title=PRODUCTION_DATAPLANE_MISMATCH::Production health data-plane identity does not match the reviewed attestation"
            exit 1
          fi

          curl \
            --silent \
            --show-error \
            --fail \
            --retry 3 \
            --retry-all-errors \
            --retry-delay 2 \
            --connect-timeout 10 \
            --max-time 30 \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$REPOSITORY/commits/main" \
            > "$main_file"

          expected_sha="$(jq -er '.sha | select(test("^[0-9a-f]{40}$"))' "$main_file")"
          main_committed_at="$(jq -er '.commit.committer.date' "$main_file")"
          production_sha="$(jq -r '.release.commitSha' "$body_file")"
          short_sha="$(jq -r '.release.shortCommitSha' "$body_file")"

          release_header="$(awk 'BEGIN{IGNORECASE=1} /^x-revalta-release:/ {gsub("\r", ""); sub(/^[^:]+:[[:space:]]*/, ""); value=$0} END{print value}' "$headers_file")"
          environment_header="$(awk 'BEGIN{IGNORECASE=1} /^x-revalta-environment:/ {gsub("\r", ""); sub(/^[^:]+:[[:space:]]*/, ""); value=$0} END{print value}' "$headers_file")"
          cache_control="$(awk 'BEGIN{IGNORECASE=1} /^cache-control:/ {gsub("\r", ""); sub(/^[^:]+:[[:space:]]*/, ""); value=$0} END{print value}' "$headers_file")"
          cdn_cache_control="$(awk 'BEGIN{IGNORECASE=1} /^cdn-cache-control:/ {gsub("\r", ""); sub(/^[^:]+:[[:space:]]*/, ""); value=$0} END{print value}' "$headers_file")"
          vercel_cdn_cache_control="$(awk 'BEGIN{IGNORECASE=1} /^vercel-cdn-cache-control:/ {gsub("\r", ""); sub(/^[^:]+:[[:space:]]*/, ""); value=$0} END{print value}' "$headers_file")"

          [[ "$release_header" == "$short_sha" ]]
          [[ "$environment_header" == "production" ]]
          [[ "$cache_control" == *"no-store"* ]]
          [[ "$cdn_cache_control" == *"no-store"* ]]
          if [[ -n "$vercel_cdn_cache_control" ]]; then
            [[ "$vercel_cdn_cache_control" == *"no-store"* ]]
          fi

          if [[ "$production_sha" != "$expected_sha" ]]; then
            echo "::error title=PRODUCTION_RELEASE_STALE::Production does not run current main. expected=$expected_sha production=$production_sha committed_at=$main_committed_at"
            exit 1
          fi

          echo "Production release verified: $short_sha matches current main"
