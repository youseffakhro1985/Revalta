name: Revalta CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: revalta-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, test, migrate and build
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: revalta_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d revalta_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/revalta_ci
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/revalta_ci
      JWT_SECRET: ci-secret-only-for-build-at-least-32-bytes
      EMAIL_FROM: noreply@revalta.se
      NODE_ENV: test

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Review dependency changes
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@v4

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Validate Prisma schema
        run: npx prisma validate

      - name: Apply migrations to clean database
        run: npx prisma migrate deploy

      - name: Check migration status
        run: npx prisma migrate status

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test:ci

      - name: Type check
        run: npm run typecheck

      - name: Audit production dependencies
        run: npm run audit:prod

      - name: Build without production migrations
        env:
          NODE_ENV: production
        run: npm run build:ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: End-to-end tests
        env:
          NODE_ENV: production
        run: npm run test:e2e
