name: Database Release

on:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: Exact verified commit SHA from main to migrate
        required: true
        type: string
      confirmation:
        description: Type MIGRATE_PRODUCTION to confirm
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: revalta-production-database-release
  cancel-in-progress: false

jobs:
  migrate:
    if: ${{ inputs.confirmation == 'MIGRATE_PRODUCTION' }}
    name: Apply production migrations
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Must match GitHub Environment name "Production" (case-insensitive).
    # Secrets DATABASE_URL + DIRECT_URL must exist on that Environment
    # (Settings → Environments → Production → Environment secrets).
    environment: Production

    steps:
      - name: Check out approved revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.commit_sha }}
          fetch-depth: 0

      - name: Verify approved main commit
        env:
          EXPECTED_SHA: ${{ inputs.commit_sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA" || (echo "Checked out commit does not match commit_sha" && exit 1)
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$EXPECTED_SHA" origin/main || (echo "commit_sha is not contained in main" && exit 1)

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate required secrets
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
        run: |
          missing=0
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::DATABASE_URL saknas i GitHub Environment 'Production'."
            missing=1
          fi
          if [ -z "$DIRECT_URL" ]; then
            echo "::error::DIRECT_URL saknas i GitHub Environment 'Production'."
            missing=1
          fi
          if [ "$missing" -ne 0 ]; then
            echo ""
            echo "Så här fixar du det:"
            echo "1. Kopiera DATABASE_URL och DIRECT_URL från Vercel → Project → Settings → Environment Variables (Production)."
            echo "2. GitHub → Settings → Environments → Production → Environment secrets."
            echo "3. Lägg till exakt namnen DATABASE_URL och DIRECT_URL med samma värden."
            echo "4. Kör Database Release igen med samma commit-SHA och MIGRATE_PRODUCTION."
            echo ""
            echo "Obs: Vercel-miljön 'Production – revalta' räcker inte. Secrets måste sitta på GitHub-miljön Production."
            exit 1
          fi

      - name: Generate Prisma client
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
        run: npx prisma generate

      - name: Show migration status before release (informational)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
        run: |
          set +e
          npx prisma migrate status
          status=$?
          set -e

          if [ "$status" -ne 0 ]; then
            echo "::notice::Pre-release migration status exited with code $status. Pending migrations are expected here; prisma migrate deploy remains the authoritative release gate."
          fi

      - name: Apply migrations
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
        run: npx prisma migrate deploy

      - name: Verify migration status after release
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
        run: npx prisma migrate status
