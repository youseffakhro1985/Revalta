name: Preview Database Status

on:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: Exact verified commit SHA from main to inspect
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: revalta-preview-database
  cancel-in-progress: false

jobs:
  status:
    name: Inspect preview migration status
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: Preview

    steps:
      - name: Check out approved revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.commit_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify approved main commit
        env:
          EXPECTED_SHA: ${{ inputs.commit_sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA" || (echo "Checked out commit does not match commit_sha" && exit 1)
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$EXPECTED_SHA" origin/main || (echo "commit_sha is not contained in main" && exit 1)

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate required Preview secrets
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
        run: |
          missing=0
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::DATABASE_URL saknas i GitHub Environment 'Preview'."
            missing=1
          fi
          if [ -z "$DIRECT_URL" ]; then
            echo "::error::DIRECT_URL saknas i GitHub Environment 'Preview'."
            missing=1
          fi
          if [ "$missing" -ne 0 ]; then
            echo "Kopiera Preview DATABASE_URL och DIRECT_URL från Vercel Preview. Använd aldrig Production-värden."
            exit 1
          fi

      - name: Assert Preview data-plane identity
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
        run: node scripts/assert-database-target.mjs --target preview

      - name: Generate Prisma client
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
        run: npx prisma generate

      - name: Inspect migration status (read-only)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
        run: |
          echo "::notice::Read-only Preview schema inspection. This workflow must never apply migrations."
          npx prisma migrate status
