name: Revalta Quality CI

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - main
      - agent/dashboard-quality-system

concurrency:
  group: revalta-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint and production build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: postgresql://revalta:revalta@localhost:5432/revalta?schema=public
      DIRECT_URL: postgresql://revalta:revalta@localhost:5432/revalta?schema=public
      JWT_SECRET: ci-only-secret-not-used-in-production
      EMAIL_FROM: noreply@example.se
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run lint checks
        shell: bash
        run: |
          set +e
          npm run lint 2>&1 | tee lint-output.txt
          status=${PIPESTATUS[0]}
          echo "LINT_EXIT_CODE=$status" >> "$GITHUB_ENV"
          exit 0

      - name: Run unit tests
        shell: bash
        run: |
          set +e
          npm run test:ci 2>&1 | tee test-output.txt
          status=${PIPESTATUS[0]}
          echo "TEST_EXIT_CODE=$status" >> "$GITHUB_ENV"
          exit 0

      - name: Upload lint diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-diagnostics
          path: lint-output.txt
          retention-days: 3

      - name: Upload test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-diagnostics
          path: test-output.txt
          retention-days: 3

      - name: Build production application
        shell: bash
        run: |
          set +e
          npm run build:ci 2>&1 | tee build-output.txt
          status=${PIPESTATUS[0]}
          echo "BUILD_EXIT_CODE=$status" >> "$GITHUB_ENV"
          exit 0

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-diagnostics
          path: build-output.txt
          retention-days: 3

      - name: Enforce verification results
        if: always()
        shell: bash
        run: |
          test "${LINT_EXIT_CODE:-1}" -eq 0
          test "${TEST_EXIT_CODE:-1}" -eq 0
          test "${BUILD_EXIT_CODE:-1}" -eq 0
