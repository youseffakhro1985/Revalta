name: Production Uptime

on:
  schedule:
    # Every 15 minutes
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: revalta-production-uptime
  cancel-in-progress: true

jobs:
  health:
    name: Probe /api/health
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check production health
        env:
          HEALTH_URL: https://www.revalta.se/api/health
        run: |
          set -euo pipefail
          response="$(curl -sS -f --max-time 20 -H 'accept: application/json' "$HEALTH_URL")"
          echo "$response" | python3 - <<'PY'
          import json, sys
          body = sys.stdin.read()
          data = json.loads(body)
          status = data.get("status")
          database = data.get("database")
          sha = (data.get("release") or {}).get("commitSha")
          modern = data.get("modernStorageOnly")
          print(f"status={status} database={database} sha={sha} modernStorageOnly={modern}")
          if status != "ok" or database != "ok":
              raise SystemExit("Production health is not ok")
          PY
