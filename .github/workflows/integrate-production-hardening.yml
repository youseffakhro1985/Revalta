name: Integrate production hardening

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

permissions:
  contents: write

concurrency:
  group: integrate-production-hardening
  cancel-in-progress: false

jobs:
  integrate-and-validate:
    if: github.head_ref == 'integration/revalta-production-hardening-20260727'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      DATABASE_URL: postgresql://revalta:revalta@localhost:5432/revalta_ci
      DIRECT_URL: postgresql://revalta:revalta@localhost:5432/revalta_ci
      JWT_SECRET: ci-only-jwt-secret-at-least-32-characters-long
      CRON_SECRET: ci-only-cron-secret-at-least-32-characters-long
      NEXT_PUBLIC_APP_URL: https://www.revalta.se
    steps:
      - name: Checkout integration branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: integration/revalta-production-hardening-20260727

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Fetch source branches
        run: |
          git fetch --quiet origin \
            cursor/product-hardening-followthrough-6157 \
            cursor/wo-board-role-scope-6157 \
            cursor/staff-read-hardening-6157

      - name: Merge reviewed feature stacks
        run: |
          set -euo pipefail
          git merge --no-edit --no-ff -X theirs origin/cursor/product-hardening-followthrough-6157
          git merge --no-edit --no-ff -X theirs origin/cursor/wo-board-role-scope-6157
          git merge --no-edit --no-ff -X theirs origin/cursor/staff-read-hardening-6157

      - name: Reconcile dashboard shell merge residue
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("src/components/dashboard/dashboard-shell.tsx")
          source = path.read_text()
          stale = '''  const roleLabel = role === "owner" ? "Ägare"
            : role === "admin" ? "Administratör"
              : role === "manager" ? "Förvaltare"
                : role === "technician" ? "Tekniker"
                  : role === "viewer" ? "Läsbehörighet"
                    : role === "resident" ? "Boende"
                      : role;

          '''
          if source.count(stale) != 1:
              raise SystemExit("Expected exactly one stale roleLabel block after stack merge")
          path.write_text(source.replace(stale, ""))
          PY

      - name: Remove temporary workflow from final tree
        run: git rm .github/workflows/integrate-production-hardening.yml

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate Prisma schema
        run: npm run db:validate

      - name: Lint
        id: lint
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npm run lint 2>&1 | tee lint-output.txt

      - name: Upload lint diagnostics
        if: steps.lint.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: lint-diagnostics
          path: lint-output.txt
          if-no-files-found: error
          retention-days: 1

      - name: Stop on lint failure
        if: steps.lint.outcome == 'failure'
        run: exit 1

      - name: Unit and route tests
        run: npm run test:ci

      - name: TypeScript
        run: npm run typecheck

      - name: Production build
        run: npm run build:ci

      - name: Commit validated integration
        run: |
          git commit -m "feat: integrate production hardening and resident security stack"
          git push origin HEAD:integration/revalta-production-hardening-20260727
