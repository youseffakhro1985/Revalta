name: Revalta Quality CI

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - main
      - agent/dashboard-quality-system

concurrency:
  group: revalta-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint and production build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: postgresql://revalta:revalta@localhost:5432/revalta?schema=public
      DIRECT_URL: postgresql://revalta:revalta@localhost:5432/revalta?schema=public
      JWT_SECRET: ci-only-secret-not-used-in-production
      EMAIL_FROM: noreply@example.se
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run lint checks
        run: npm run lint

      - name: Build production application
        run: npm run build:ci
