name: Preview Browser E2E

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      preview_url:
        description: "Exact Vercel Preview URL to test"
        required: true
        type: string

permissions:
  contents: read
  deployments: read

concurrency:
  group: preview-e2e-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  auth-navigation:
    name: Auth, navigation, mobile and Command Center
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install application dependencies
        run: npm ci

      - name: Resolve exact-SHA Preview
        id: preview
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          MANUAL_PREVIEW_URL: ${{ inputs.preview_url }}
        shell: bash
        run: |
          set -euo pipefail
          preview_origin='^https://[a-z0-9-]+\.vercel\.app/?$'
          if [[ -n "${MANUAL_PREVIEW_URL:-}" ]]; then
            if [[ ! "$MANUAL_PREVIEW_URL" =~ $preview_origin ]]; then
              echo "BLOCKED: manual URL must be an exact Vercel origin" >&2
              exit 1
            fi
            echo "url=${MANUAL_PREVIEW_URL%/}" >> "$GITHUB_OUTPUT"
            echo "mode=preview" >> "$GITHUB_OUTPUT"
            echo "reason=manual_preview" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          for attempt in $(seq 1 24); do
            deployments=$(curl --fail --silent --show-error \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/deployments?sha=${HEAD_SHA}")

            statuses_url=$(printf '%s' "$deployments" | jq -r --arg sha "$HEAD_SHA" '[.[] | select(.environment == "Preview" and .sha == $sha)][0].statuses_url // empty')
            if [[ -n "$statuses_url" ]]; then
              statuses=$(curl --fail --silent --show-error \
                -H "Authorization: Bearer ${GH_TOKEN}" \
                -H "Accept: application/vnd.github+json" \
                -H "X-GitHub-Api-Version: 2022-11-28" \
                "$statuses_url")
              state=$(printf '%s' "$statuses" | jq -r '.[0].state // empty')
              url=$(printf '%s' "$statuses" | jq -r '.[0].environment_url // .[0].target_url // empty')

              if [[ "$state" == "success" && "$url" =~ $preview_origin ]]; then
                echo "url=${url%/}" >> "$GITHUB_OUTPUT"
                echo "mode=preview" >> "$GITHUB_OUTPUT"
                echo "reason=exact_sha_preview" >> "$GITHUB_OUTPUT"
                echo "Resolved exact-SHA Preview: ${url%/}"
                exit 0
              fi
              if [[ "$state" == "failure" || "$state" == "error" ]]; then
                echo "BLOCKED: Preview deployment failed for ${HEAD_SHA}" >&2
                exit 1
              fi
            fi

            echo "Preview not ready yet (attempt ${attempt}/24)"
            sleep 10
          done

          echo "BLOCKED: exact-SHA Vercel Preview was not published before timeout" >&2
          exit 1

      - name: Install pinned browser runner
        run: |
          npm install --no-save --package-lock=false playwright@1.60.0
          npx playwright install --with-deps chromium

      - name: Run browser E2E
        id: browser
        env:
          E2E_BASE_URL: ${{ steps.preview.outputs.url }}
          E2E_EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          E2E_PREVIEW_DATA_ISOLATED: ${{ vars.E2E_PREVIEW_DATA_ISOLATED }}
          E2E_VERIFIED_EMAIL: ${{ secrets.E2E_VERIFIED_EMAIL }}
          E2E_VERIFIED_PASSWORD: ${{ secrets.E2E_VERIFIED_PASSWORD }}
          E2E_VERIFIED_COMPANY_ID: ${{ secrets.E2E_VERIFIED_COMPANY_ID }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: node e2e/auth-navigation.mjs

      - name: Record verification result
        if: always()
        env:
          BROWSER_OUTCOME: ${{ steps.browser.outcome }}
          CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        shell: bash
        run: |
          echo "### Required Vercel Preview verification" >> "$GITHUB_STEP_SUMMARY"
          echo "Candidate: ${CANDIDATE_SHA}" >> "$GITHUB_STEP_SUMMARY"
          if [[ "$BROWSER_OUTCOME" == "success" ]]; then
            echo "PASS: runtime SHA, deployment and datastore attested; all mandatory browser steps completed. See sanitized runner evidence in the browser step log." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "BLOCKED / NOT VERIFIED: mandatory Preview acceptance did not complete. No local fallback and no release approval." >> "$GITHUB_STEP_SUMMARY"
          fi
