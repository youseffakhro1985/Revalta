name: Integrate production hardening

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

permissions:
  contents: write

concurrency:
  group: integrate-production-hardening
  cancel-in-progress: false

jobs:
  integrate-and-validate:
    if: github.head_ref == 'integration/revalta-production-hardening-20260727'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      DATABASE_URL: postgresql://revalta:revalta@localhost:5432/revalta_ci
      DIRECT_URL: postgresql://revalta:revalta@localhost:5432/revalta_ci
      JWT_SECRET: ci-only-jwt-secret-at-least-32-characters-long
      CRON_SECRET: ci-only-cron-secret-at-least-32-characters-long
      NEXT_PUBLIC_APP_URL: https://www.revalta.se
    steps:
      - name: Checkout integration branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          ref: integration/revalta-production-hardening-20260727

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Fetch source branches
        run: |
          git fetch --quiet origin \
            cursor/product-hardening-followthrough-6157 \
            cursor/wo-board-role-scope-6157 \
            cursor/staff-read-hardening-6157

      - name: Merge reviewed feature stacks
        run: |
          set -euo pipefail
          git merge --no-edit --no-ff -X theirs origin/cursor/product-hardening-followthrough-6157
          git merge --no-edit --no-ff -X theirs origin/cursor/wo-board-role-scope-6157
          git merge --no-edit --no-ff -X theirs origin/cursor/staff-read-hardening-6157

      - name: Reconcile permission exports after stacked merge
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          permissions = Path("src/lib/permissions.ts")
          source = permissions.read_text()
          additions = []
          if "export function shouldScopeToAssignedWork" not in source:
              additions.append('''
          /** Technicians (and residents) only see work assigned to themselves. */
          export function shouldScopeToAssignedWork(role: string) {
            return hasRole(role, ["technician", "resident"]);
          }
          ''')
          if "export function canAssignWorkOrders" not in source:
              additions.append('''
          /** Managers and admins distribute work; technicians execute assigned work. */
          export function canAssignWorkOrders(role: string) {
            return hasRole(role, ["owner", "admin", "manager"]);
          }
          ''')
          if "export function canWriteOperations" not in source:
              additions.append('''
          /** Viewer/resident are read-only in the manager workspace. */
          export function canWriteOperations(role: string) {
            return canManageTickets(role);
          }
          ''')
          if additions:
              permissions.write_text(source.rstrip() + "\n" + "".join(additions))

          current_user = Path("src/lib/current-user.ts")
          source = current_user.read_text()
          export_start = source.index("export {")
          export_end = source.index('} from "@/lib/permissions";', export_start)
          block = source[export_start:export_end]
          required = [
              "canAssignWorkOrders",
              "canWriteOperations",
              "shouldScopeToAssignedWork",
          ]
          missing = [name for name in required if name not in block]
          if missing:
              insertion = "".join(f"  {name},\n" for name in missing)
              source = source[:export_end] + insertion + source[export_end:]
              current_user.write_text(source)
          PY

      - name: Reconcile dashboard shell merge residue
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path("src/components/dashboard/dashboard-shell.tsx")
          source = path.read_text()

          pattern = re.compile(
              r'(?ms)^  const roleLabel = role === "owner" \? "Ägare".*?^\s*: role;\n\n?'
          )
          source, replacements = pattern.subn("", source)
          if replacements not in (0, 1):
              raise SystemExit(
                  f"Expected at most one stale roleLabel declaration after stack merge; found {replacements}"
              )

          permission_names = [
              "canManageBilling",
              "canManageCompany",
              "canManageIntegrations",
              "canViewAudit",
              "canViewOperations",
              "isResident",
          ]
          source = re.sub(
              r'import \{[^}]*\} from "@/lib/permissions";',
              'import {\n' + ''.join(f'  {name},\n' for name in permission_names) + '} from "@/lib/permissions";',
              source,
              count=1,
              flags=re.S,
          )
          if 'from "@/lib/permissions";' not in source:
              marker = 'import { WorkOrderLockIndicator } from "@/components/dashboard/work-order-lock-indicator";\n'
              replacement = marker + 'import {\n' + ''.join(f'  {name},\n' for name in permission_names) + '} from "@/lib/permissions";\n'
              if marker not in source:
                  raise SystemExit("Could not find dashboard shell import insertion point")
              source = source.replace(marker, replacement, 1)

          display = "  const displayName = userName?.trim() || userEmail;\n"
          first = source.find(display)
          if first == -1:
              raise SystemExit("Missing displayName declaration after stack merge")
          tail = source[first + len(display):].replace(display, "")
          source = source[:first + len(display)] + tail

          path.write_text(source)
          PY

      - name: Reconcile work-order role test mocks
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("src/app/api/work-orders/route.test.ts")
          source = path.read_text()
          needle = "  getCurrentUser: getCurrentUserMock,\n"
          replacement = """  getCurrentUser: getCurrentUserMock,
          canAssignWorkOrders: (role: string | null | undefined) =>
            role === "owner" || role === "admin" || role === "manager",
          canManageTickets: (role: string | null | undefined) =>
            role === "owner" || role === "admin" || role === "manager" || role === "technician",
          shouldScopeToAssignedWork: (role: string | null | undefined) => role === "technician",
          """
          if "canAssignWorkOrders:" not in source:
              occurrences = source.count(needle)
              if occurrences != 1:
                  raise SystemExit(
                      f"Expected exactly one current-user mock insertion point; found {occurrences}"
                  )
              source = source.replace(needle, replacement, 1)
              path.write_text(source)
          PY

      - name: Remove temporary workflow from final tree
        run: git rm --ignore-unmatch .github/workflows/integrate-production-hardening.yml

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate Prisma schema
        run: npm run db:validate

      - name: Lint
        id: lint
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npm run lint 2>&1 | tee lint-output.txt

      - name: Upload lint diagnostics
        if: steps.lint.outcome == 'failure'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: lint-diagnostics
          path: lint-output.txt
          if-no-files-found: error
          retention-days: 1

      - name: Stop on lint failure
        if: steps.lint.outcome == 'failure'
        run: exit 1

      - name: Unit and route tests
        id: tests
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npm run test:ci 2>&1 | tee test-output.txt

      - name: Upload test diagnostics
        if: steps.tests.outcome == 'failure'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: test-diagnostics
          path: test-output.txt
          if-no-files-found: error
          retention-days: 1

      - name: Stop on test failure
        if: steps.tests.outcome == 'failure'
        run: exit 1

      - name: TypeScript
        id: typecheck
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npm run typecheck 2>&1 | tee typecheck-output.txt

      - name: Upload TypeScript diagnostics
        if: steps.typecheck.outcome == 'failure'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: typecheck-diagnostics
          path: typecheck-output.txt
          if-no-files-found: error
          retention-days: 1

      - name: Stop on TypeScript failure
        if: steps.typecheck.outcome == 'failure'
        run: exit 1

      - name: Production build
        run: npm run build:ci

      - name: Commit validated integration
        run: |
          git commit -m "feat: integrate production hardening and resident security stack"
          git push origin HEAD:integration/revalta-production-hardening-20260727
