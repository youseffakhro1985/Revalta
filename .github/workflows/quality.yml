name: Revalta Quality

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Lint, types, tests and production build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/revalta_ci?schema=public
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/revalta_ci?schema=public
      JWT_SECRET: ci-only-secret-not-for-production
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      EMAIL_FROM: ci@revalta.se
      CRON_SECRET: ci-cron-secret
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.19.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Tests
        run: npm run test:ci

      - name: Production build
        run: npm run build:ci
