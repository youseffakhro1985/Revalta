name: Production Uptime

on:
  schedule:
    # Every 15 minutes
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: revalta-production-uptime
  cancel-in-progress: true

jobs:
  health:
    name: Probe /api/health
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check production health and release identity
        env:
          HEALTH_URL: https://www.revalta.se/api/health
        run: |
          set -euo pipefail

          body_file="$(mktemp)"
          headers_file="$(mktemp)"
          trap 'rm -f "$body_file" "$headers_file"' EXIT

          curl \
            --silent \
            --show-error \
            --fail \
            --max-time 20 \
            --retry 2 \
            --retry-all-errors \
            --retry-delay 2 \
            --header 'accept: application/json' \
            --dump-header "$headers_file" \
            --output "$body_file" \
            "$HEALTH_URL"

          python3 - "$body_file" "$headers_file" <<'PY'
          import json
          import re
          import sys
          from pathlib import Path

          body_path = Path(sys.argv[1])
          headers_path = Path(sys.argv[2])

          data = json.loads(body_path.read_text(encoding="utf-8"))
          raw_headers = headers_path.read_text(encoding="utf-8")

          headers = {}
          for line in raw_headers.splitlines():
              if ":" not in line:
                  continue
              name, value = line.split(":", 1)
              headers[name.strip().lower()] = value.strip()

          status = data.get("status")
          database = data.get("database")
          release = data.get("release") or {}
          sha = release.get("commitSha")
          short_sha = release.get("shortCommitSha")
          branch = release.get("branch")
          environment = release.get("environment")
          modern = data.get("modernStorageOnly")

          header_release = headers.get("x-revalta-release")
          header_environment = headers.get("x-revalta-environment")
          cache_control = headers.get("cache-control", "").lower()
          cdn_cache_control = headers.get("cdn-cache-control", "").lower()
          vercel_cdn_cache_control = headers.get("vercel-cdn-cache-control", "").lower()
          content_type_options = headers.get("x-content-type-options", "").lower()

          print(
              " ".join(
                  [
                      f"status={status}",
                      f"database={database}",
                      f"sha={sha}",
                      f"branch={branch}",
                      f"environment={environment}",
                      f"modernStorageOnly={modern}",
                  ]
              )
          )

          if status != "ok" or database != "ok":
              raise SystemExit("Production health is not ok")
          if environment != "production":
              raise SystemExit(f"Expected production environment, got {environment!r}")
          if not isinstance(sha, str) or not re.fullmatch(r"[0-9a-f]{40}", sha):
              raise SystemExit(f"Invalid production commit SHA: {sha!r}")
          if short_sha != sha[:7]:
              raise SystemExit("Short release SHA does not match full SHA")
          if header_release != short_sha:
              raise SystemExit("X-Revalta-Release does not match response release")
          if header_environment != "production":
              raise SystemExit("X-Revalta-Environment is not production")
          if "no-store" not in cache_control:
              raise SystemExit("Cache-Control must include no-store")
          if "no-store" not in cdn_cache_control:
              raise SystemExit("CDN-Cache-Control must include no-store")
          if "no-store" not in vercel_cdn_cache_control:
              raise SystemExit("Vercel-CDN-Cache-Control must include no-store")
          if content_type_options != "nosniff":
              raise SystemExit("X-Content-Type-Options must be nosniff")
          PY
