name: Preview Browser E2E

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      preview_url:
        description: "Exact Vercel Preview URL to test"
        required: true
        type: string

permissions:
  contents: read
  deployments: read

concurrency:
  group: preview-e2e-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  auth-navigation:
    name: Auth, navigation, mobile and Command Center
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
    steps:
      - name: Check out candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install application dependencies
        run: npm ci

      - name: Resolve exact-SHA Preview
        id: preview
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          MANUAL_PREVIEW_URL: ${{ inputs.preview_url }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "${MANUAL_PREVIEW_URL:-}" ]]; then
            echo "url=${MANUAL_PREVIEW_URL%/}" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          for attempt in $(seq 1 60); do
            deployments=$(curl --fail --silent --show-error \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/deployments?sha=${HEAD_SHA}")

            statuses_url=$(printf '%s' "$deployments" | jq -r '[.[] | select(.environment == "Preview")][0].statuses_url // empty')
            if [[ -n "$statuses_url" ]]; then
              statuses=$(curl --fail --silent --show-error \
                -H "Authorization: Bearer ${GH_TOKEN}" \
                -H "Accept: application/vnd.github+json" \
                -H "X-GitHub-Api-Version: 2022-11-28" \
                "$statuses_url")
              state=$(printf '%s' "$statuses" | jq -r '.[0].state // empty')
              url=$(printf '%s' "$statuses" | jq -r '.[0].environment_url // .[0].target_url // empty')

              if [[ "$state" == "success" && "$url" == https://*.vercel.app* ]]; then
                echo "url=${url%/}" >> "$GITHUB_OUTPUT"
                echo "Resolved exact-SHA Preview: ${url%/}"
                exit 0
              fi
              if [[ "$state" == "failure" || "$state" == "error" ]]; then
                echo "Preview deployment failed for ${HEAD_SHA}" >&2
                exit 1
              fi
            fi

            echo "Preview not ready yet (attempt ${attempt}/60)"
            sleep 10
          done

          echo "Timed out waiting for exact-SHA Vercel Preview ${HEAD_SHA}" >&2
          exit 1

      - name: Install pinned browser runner
        run: |
          npm install --no-save --package-lock=false playwright@1.60.0
          npx playwright install --with-deps chromium

      - name: Run browser E2E
        env:
          E2E_BASE_URL: ${{ steps.preview.outputs.url }}
        run: node e2e/auth-navigation.mjs
