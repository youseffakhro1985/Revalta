name: Release Boundary Smoke

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: HTTPS URL for the deployed release candidate
        required: true
        type: string
      expected_sha:
        description: Full 40-character Git commit SHA expected from /api/health
        required: true
        type: string
      expected_environment:
        description: Vercel environment expected from /api/health
        required: true
        type: choice
        options:
          - preview
          - production
      expected_branch:
        description: Git branch expected from /api/health
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-boundary-smoke-${{ inputs.expected_environment }}-${{ inputs.expected_branch }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify exact deployed release boundaries
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      BASE_URL: ${{ inputs.base_url }}
      EXPECTED_SHA: ${{ inputs.expected_sha }}
      EXPECTED_ENVIRONMENT: ${{ inputs.expected_environment }}
      EXPECTED_BRANCH: ${{ inputs.expected_branch }}

    steps:
      - name: Check out expected release commit
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.expected_sha }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Validate workflow inputs
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$BASE_URL" =~ ^https:// ]]; then
            echo "BASE_URL must use HTTPS" >&2
            exit 1
          fi
          if [[ ! "$EXPECTED_SHA" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "EXPECTED_SHA must be a full 40-character Git SHA" >&2
            exit 1
          fi
          if [[ "$EXPECTED_ENVIRONMENT" == "production" && "$EXPECTED_BRANCH" != "main" ]]; then
            echo "Production smoke must target branch main" >&2
            exit 1
          fi
          if [[ "$EXPECTED_ENVIRONMENT" == "preview" && "$EXPECTED_BRANCH" != "release-preview" ]]; then
            echo "Preview smoke must target branch release-preview" >&2
            exit 1
          fi

      - name: Verify deployed release boundaries
        run: npm run smoke:release-boundaries
